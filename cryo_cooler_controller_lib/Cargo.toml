[package]
name = "cryo_cooler_controller_lib"
version = "0.1.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serial = "*"
crc = "*"
bitflags = "2.0.0-rc.1"
chrono = "0.4"

[dev-dependencies]
# Solo per i test di diagnostica: `serial` non espone l'enumerazione delle
# porte, quindi il test usa `serialport` per i soli nomi e `serial` (il
# driver di produzione) per l'apertura e l'interrogazione.
serialport = "*"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
